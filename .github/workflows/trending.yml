name: 트렌딩 수집
on:
  schedule:
    - cron: "5 0 * * *"   # 매일 09:05 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/trending.py public/data/trending-raw.json
      - run: |
          git config user.name choi227
          git config user.email choi227@users.noreply.github.com
          git add public/data/trending-raw.json
          git diff --cached --quiet || git commit -m "트렌딩 수집 $(TZ=Asia/Seoul date +%F)"
          git push
