<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 모닝 브리핑</title>
<meta name="description" content="매일 아침 8시, 밤사이 AI 뉴스와 GitHub 트렌딩을 5분 안에">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314161b'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: 12칸 벤토 그리드. 요약(헤드라인·시장·한 줄) → 뉴스 카드 그리드(분야 필터) → 트렌딩(순위 막대 + 분포 패널) → 할 일·지난 호 */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#fafafa; --ink:#06191d; --muted:#667074; --line:#e9e9eb;
  --accent:#5b1fd1; --accent-soft:#e2d7fa; --star:#e99a0c; --star-soft:#fbefd6; --up:#12805a; --down:#cf3a3a;
  --violet:#5b1fd1; --violet-soft:#e2d7fa; --violet-soft-2:#efe9fd; --brand:#0907ff;
  --c-invest:#1f4fe0; --c-chip:#7a45d6; --c-market:#cf3a3a; --c-policy:#b5610b; --c-startup:#12805a; --c-model:#0b84a5; --c-korea:#c2357a;
  --l-ts:#3178c6; --l-py:#d9a90f; --l-go:#00a7c4; --l-js:#c9b400;
  --f-display:"Gothic A1","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1014; --surface:#171a20; --surface-2:#1d2128; --ink:#eceef2; --muted:#9aa1ad; --line:#272b33;
  --accent:#7090ff; --accent-soft:#1d2645; --star:#f5b53d; --star-soft:#3a2f17; --up:#3ccf93; --down:#ff6b6b;
  --c-invest:#7090ff; --c-chip:#b08cff; --c-market:#ff6b6b; --c-policy:#f0a24d; --c-startup:#3ccf93; --c-model:#4cc6e6; --c-korea:#f07ab4; --violet:#b69bff; --violet-soft:#2c2350; --violet-soft-2:#221c3d; --brand:#6d6bff;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#171a20; --surface-2:#1d2128; --ink:#eceef2; --muted:#9aa1ad; --line:#272b33;
  --accent:#7090ff; --accent-soft:#1d2645; --star:#f5b53d; --star-soft:#3a2f17; --up:#3ccf93; --down:#ff6b6b;
  --c-invest:#7090ff; --c-chip:#b08cff; --c-market:#ff6b6b; --c-policy:#f0a24d; --c-startup:#3ccf93; --c-model:#4cc6e6; --c-korea:#f07ab4; --violet:#b69bff; --violet-soft:#2c2350; --violet-soft-2:#221c3d; --brand:#6d6bff;
  color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 헤더 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .row1{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700}
.datenav{margin-left:auto;display:flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px}
.datenav button{border:0;background:transparent;color:var(--muted);font:inherit;width:28px;height:28px;border-radius:99px;cursor:pointer}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav span{font-family:var(--f-mono);font-size:13px;padding:0 8px;font-weight:500}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs a{flex:0 0 auto;text-decoration:none;font-size:14px;font-weight:500;color:var(--muted);padding:6px 12px;border-radius:99px;transition:background .2s,color .2s}
.tabs a.on{background:var(--ink);color:var(--surface)}
.tabs a:not(.on):hover{background:var(--surface-2);color:var(--ink)}

/* 공통 카드 */
main{display:grid;gap:44px;padding-block:28px 64px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.label{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-title{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-title h2{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,2.6vw,28px);letter-spacing:-.02em;margin:0}
.sec-title p{margin:0;color:var(--muted);font-size:14px}

/* 요약 벤토 */
.lead{grid-column:span 7;grid-row:span 2;display:flex;flex-direction:column;gap:16px;background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lead .label{color:color-mix(in srgb,var(--surface) 65%,transparent)}
.lead h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.6vw,40px);line-height:1.18;letter-spacing:-.03em;margin:0;text-wrap:balance}
.lead p{margin:0;color:color-mix(in srgb,var(--surface) 78%,transparent);max-width:40em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:auto}
.stat{border:1px solid color-mix(in srgb,var(--surface) 20%,transparent);border-radius:10px;padding:12px}
.stat b{display:block;font-family:var(--f-mono);font-size:clamp(18px,2.2vw,24px);font-weight:700;letter-spacing:-.02em}
.stat span{font-size:12px;color:color-mix(in srgb,var(--surface) 65%,transparent)}
.lead .src{font-size:13px;color:color-mix(in srgb,var(--surface) 65%,transparent)}
.market{grid-column:span 5}
.mrow{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;align-items:center;gap:10px;padding-block:8px;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .nm{font-weight:600;font-size:14px}
.mbar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:flex;justify-content:flex-end}
.mbar i{display:block;height:100%;background:var(--down);border-radius:99px;transform-origin:right;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.mrow .v{font-family:var(--f-mono);font-weight:700;text-align:right;color:var(--down);font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.oneline{grid-column:span 5;background:var(--surface-2);border-color:var(--line)}
.oneline p{margin:0 0 12px;font-size:16px;font-weight:500;line-height:1.55}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:500;padding:3px 9px;border-radius:6px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}

/* 뉴스 */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:6px}
.filters button .dot{width:7px;height:7px;border-radius:50%}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:16px}
.ncard{display:flex;flex-direction:column;gap:8px;transition:border-color .2s,opacity .5s}
.ncard:hover{border-color:color-mix(in srgb,var(--ink) 22%,transparent)}
.ncard .cat{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.ncard .cat i{width:8px;height:8px;border-radius:50%}
.ncard h3{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.4;letter-spacing:-.015em;margin:0;text-wrap:balance}
.ncard p{margin:0;color:var(--muted);font-size:14px;line-height:1.6;flex:1}
.ncard a{font-size:12px;color:var(--muted);text-underline-offset:3px}
.ncard a:hover{color:var(--accent)}
.ncard.big{grid-column:span 2}
.ncard[hidden]{display:none!important}
.loading{padding:48px 0;color:var(--muted)}

/* 트렌딩 */
.tlist{grid-column:span 8;padding:8px 20px}
.thead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);padding:4px 12px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.repos{list-style:none;margin:0;padding:0}
.repo{display:grid;grid-template-columns:28px minmax(0,1fr) 92px;gap:4px 14px;padding-block:16px;border-bottom:1px solid var(--line);align-items:center}
.repo:last-child{border-bottom:0}
.rank{font-family:var(--f-mono);font-weight:700;color:var(--muted);font-size:14px}
.repo .nm{font-family:var(--f-mono);font-size:14px;font-weight:500;word-break:break-all;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.repo .nm a{text-decoration:none}
.repo .nm a:hover{text-decoration:underline}
.repo .nm small{color:var(--muted);font-weight:400}
.lang{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:500}
.lang i{width:8px;height:8px;border-radius:50%}
.kind{font-family:var(--f-body);font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.repo p{grid-column:2;margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.repo .bar{grid-column:2/4;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.repo .bar i{display:block;height:100%;border-radius:99px;background:var(--star);transform-origin:left;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.repo .num{grid-row:1;grid-column:3;text-align:right;font-family:var(--f-mono)}
.repo .num b{display:block;font-size:17px;font-weight:700;color:var(--star)}
.repo .num span{font-size:11px;color:var(--muted)}
.side{grid-column:span 4;display:grid;gap:16px;align-content:start}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 12px}
.stack i{display:block;height:100%}
.legend{display:grid;gap:6px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legend b{margin-left:auto;font-family:var(--f-mono);font-weight:500}
.insight p{margin:0;font-size:14px}
.insight strong{color:var(--accent)}

/* 커뮤니티 */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.clist{list-style:none;margin:0;padding:0}
.citem{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding-block:12px;border-top:1px solid var(--line)}
.citem:first-child{border-top:0;padding-top:4px}
.ct{font-weight:600;font-size:15px;line-height:1.45;text-decoration:none}
.ct:hover{text-decoration:underline}
.co{font-size:12px;color:var(--muted);margin-top:2px}
.cm{display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--muted)}
.cm a{color:var(--muted)}
.cm .mono{color:var(--star)}
@media (max-width:900px){.cgrid{grid-template-columns:1fr}}
.strend{grid-column:1/-1}
.sthead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sthead .seg{margin-bottom:10px}
.stwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,1fr);gap:20px;align-items:start}
.tchart{width:100%;height:auto;display:block}
.tchart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.tchart .gl{stroke:var(--line);stroke-width:1}
.strend .legend div{gap:8px}
.strend .legend .lh{font-size:11px;color:var(--muted)}
.tch{margin-left:auto;font-size:12px;min-width:48px;text-align:right}
.strend .legend b{margin-left:12px;min-width:32px;text-align:right}
@media (max-width:900px){.stwrap{grid-template-columns:1fr}}
@media (max-width:640px){.tchart text{font-size:18px}}
.ytgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.ytl{margin-top:4px}
.ytc{padding:0;overflow:hidden;display:flex;flex-direction:column}
.yth{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;margin:0;background:var(--surface-2);cursor:pointer;overflow:hidden}
.shorts .yth,.shorts .ytf{aspect-ratio:9/16}
.yth img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.yth:hover img{transform:scale(1.04)}
.ytf{display:block;width:100%;aspect-ratio:16/9;border:0}
.ytr{position:absolute;left:8px;top:8px;font-family:var(--f-mono);font-weight:700;font-size:12px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 7px}
.ytd{position:absolute;right:8px;bottom:8px;font-size:11px;background:rgba(0,0,0,.7);color:#fff;border-radius:5px;padding:1px 6px}
.ytp{position:absolute;inset:0;margin:auto;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:16px;opacity:0;transition:opacity .2s}
.yth:hover .ytp,.yth:focus-visible .ytp{opacity:1}
.ytb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.ytb h3{font-size:14px;font-weight:600;line-height:1.4;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ytb h3 a{text-decoration:none}.ytb h3 a:hover{color:var(--accent)}
.ytb p{font-size:13px;color:var(--muted);margin:4px 0 0;line-height:1.5}
.ytb .co{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ytm{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;font-size:13px}
.ytm b{color:var(--ink);font-weight:700}
.ytx{font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.ytx.hot{background:var(--star-soft);color:var(--star);border-color:transparent}
.ytnote{margin-top:0}
@media (max-width:1100px){.ytgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.ytgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* 할 일 · 지난 호 */
.todo{grid-column:span 7}
.archive{grid-column:span 5}
.todo ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.todo label{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:10px;cursor:pointer}
.todo label:hover{background:var(--surface-2)}
.todo input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--accent);flex:0 0 auto}
.todo input:checked + span{text-decoration:line-through;color:var(--muted)}
.issues{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:4px}
.issue{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink);transition:background .2s}
.issue:hover{background:var(--surface-2)}
.issue .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.issue .tt{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.issue.now{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.issue.now .no{color:var(--accent);font-weight:700}
footer{color:var(--muted);font-size:12px;padding-block:0 40px}

/* 등장 효과: 화면 아래 요소에만 적용 */
.rv{transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1),border-color .2s}
.pre{opacity:0;transform:translateY(24px)}
.pre .bar i,.pre .mbar i{transform:scaleX(0)}

@media (max-width:900px){
  .lead,.market,.oneline,.tlist,.side,.todo,.archive{grid-column:1/-1}
  .lead{grid-row:auto}
  .ncard.big{grid-column:auto}
}
@media (max-width:480px){
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:last-child{grid-column:1/-1}
  .repo{grid-template-columns:22px minmax(0,1fr) 72px}
  .tlist{padding:4px 14px}
  .datenav{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .pre{opacity:1;transform:none}
  .pre .bar i,.pre .mbar i{transform:none}
  *{transition:none!important}
}

/* 섹션 구분 시안 v3: 색은 그대로, 섹션마다 박스 */
main{gap:44px;padding-block:32px 64px}
main>section{background:var(--surface-2);border:1px solid var(--line);border-radius:calc(var(--r) + 6px);padding:28px 28px 32px}
.sec-title{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px;align-items:flex-end}
.sec-title h2{font-size:clamp(24px,3vw,30px)}
main>section .oneline{background:var(--surface)}
.sec-title p{margin-top:6px}
@media (max-width:640px){main{gap:28px}main>section{padding:20px 14px 22px;border-radius:var(--r)}}

/* 시안: RnDcircle 느낌 색감 (흰 바탕, 큰 둥근 박스, 연보라 칩) */
main>section{background:var(--surface);border-color:var(--line);border-radius:28px;box-shadow:0 1px 2px rgba(6,25,29,.03)}
main>section .card{background:var(--surface-2);border-color:var(--line);border-radius:18px}
main>section .lead{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
main>section .lead .label,main>section .lead .src,main>section .stat span{color:var(--muted)}
main>section .lead p{color:var(--muted)}
main>section .stat{background:var(--surface);border-color:var(--line)}
main>section .oneline .pill{background:var(--surface);color:var(--muted);border-color:var(--line);font-weight:500}
.top{background:color-mix(in srgb,var(--surface) 92%,transparent)}
.tabs a.on{background:var(--violet-soft);color:var(--violet);font-weight:600}
.tabs a:not(.on):hover{background:var(--surface-2)}
.pill{background:var(--violet-soft);color:var(--violet);border-color:transparent;font-weight:600}
.kind,.ytx{background:var(--violet-soft-2);color:var(--violet);border-color:transparent}
.sec-title{border-bottom-color:var(--line)}
.brand .mark{background:linear-gradient(135deg,var(--brand),var(--violet))}
.datenav{background:var(--surface-2)}
.filters button[aria-pressed="true"]{background:var(--violet-soft);color:var(--violet);border-color:transparent}

/* 유튜브 지역 전환 · 네이버 급상승 검색어 */
.ytctl{display:flex;gap:8px;flex-wrap:wrap}
.nvhot{grid-column:1/-1}
.nvhead{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.nvkw button small{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.nvkw button .mono{font-size:11px;opacity:.7}
.nvcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:10px}
.nvcol>.label{margin:8px 0 2px}
@media (max-width:900px){.nvcols{grid-template-columns:1fr}}
.nvcols .clist{display:flex;flex-direction:column;gap:10px}
.nvcols .citem,.nvcols .citem:first-child{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;grid-template-columns:22px minmax(0,1fr);gap:10px}
.nvcols .rank{font-size:13px;line-height:1.5}
.nvcols .ct{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.45;height:2.9em}
.nvcols .ct:hover{color:var(--violet,var(--accent))}
.nvcols .co{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;line-height:1.5;height:3em}
.nvcols .cm{margin-top:6px;height:1.5em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}
</style>
